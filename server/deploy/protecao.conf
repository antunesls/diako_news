# Isolamento extra do serviço (instalado em /etc/systemd/system/diako-news.service.d/).
# Em containers LXC sem "nesting" o systemd pode não conseguir aplicar estas opções;
# nesse caso o instalar-lxc.sh remove este arquivo automaticamente.
[Service]
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=true
PrivateTmp=true
ReadWritePaths=/opt/diako-news/data
