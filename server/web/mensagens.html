<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caixa de mensagens — DiakoNews</title>
<link rel="stylesheet" href="/estilo.css?v=5">
</head>
<body class="publico"><main>
  <header><img src="/logo.png" alt="DiakoNews"></header>
  <section id="formulario">
    <p class="sobretitulo">Queremos ouvir você</p>
    <h1>Caixa de dúvidas, sugestões e críticas</h1>
    <p class="intro">Sua mensagem será vista apenas pela equipe responsável.</p>
    <form id="form" class="cartao">
      <div class="campo"><label for="tipo">Tipo de mensagem</label>
        <select id="tipo" required><option value="">Selecione</option><option value="duvida">Dúvida</option><option value="sugestao">Sugestão</option><option value="critica">Crítica</option></select></div>
      <div class="campo"><label for="texto">Sua mensagem</label><textarea id="texto" maxlength="2000" required></textarea><span class="dica" id="contador">0/2000</span></div>
      <div class="campo"><label for="nome">Seu nome <span class="dica">(opcional)</span></label><input id="nome" maxlength="80" autocomplete="name"></div>
      <div class="campo"><label for="contato">E-mail ou telefone <span class="dica">(opcional, para contato manual)</span></label><input id="contato" maxlength="120" autocomplete="email"></div>
      <div class="escondido" aria-hidden="true"><label for="website">Não preencha</label><input id="website" tabindex="-1" autocomplete="off"></div>
      <p id="erro" class="erro" role="alert" hidden></p>
      <button class="botao" id="enviar">Enviar mensagem</button>
    </form>
  </section>
  <section id="obrigado" class="cartao" hidden><h2>Recebemos sua mensagem</h2><p>Obrigado por contribuir!</p><button class="botao secundario" id="outra">Enviar outra</button></section>
</main>
<script>
  'use strict';
  const $ = (id) => document.getElementById(id);
  fetch('/api/public/site').then(r => r.ok ? r.json() : null).then(s => {
    if (s?.nomeIgreja) document.title = 'Caixa de mensagens — ' + s.nomeIgreja;
  }).catch(() => {});
  $('texto').addEventListener('input', () => $('contador').textContent = $('texto').value.length + '/2000');
  $('form').addEventListener('submit', async (event) => {
    event.preventDefault();
    $('erro').hidden = true;
    $('enviar').disabled = true;
    try {
      const r = await fetch('/api/public/mensagens', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tipo: $('tipo').value, texto: $('texto').value, nome: $('nome').value,
          contato: $('contato').value, website: $('website').value }),
      });
      if (!r.ok) {
        const j = await r.json().catch(() => ({}));
        throw new Error(j.erro || 'Não foi possível enviar. Tente novamente.');
      }
      $('form').reset();
      $('contador').textContent = '0/2000';
      $('formulario').hidden = true;
      $('obrigado').hidden = false;
    } catch (e) {
      $('erro').textContent = e.message || 'Sem conexão. Tente novamente.';
      $('erro').hidden = false;
    } finally { $('enviar').disabled = false; }
  });
  $('outra').addEventListener('click', () => { $('obrigado').hidden = true; $('formulario').hidden = false; $('tipo').focus(); });
</script>
</body></html>
