<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Igreja Diakonia Tulipas</title>
<meta name="description" content="Avisos, agenda, horários dos cultos e pedidos de oração.">
<meta name="theme-color" content="#f7f5f0">
<link rel="stylesheet" href="/estilo.css?v=5">
<style>
  .topo-site { background: var(--superficie); border-bottom: 1px solid var(--linha); }
  .topo-site .dentro { max-width: 1120px; margin: 0 auto; padding: 14px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; }
  .topo-site img { height: 40px; width: auto; display: block; }
  .topo-site nav { display: flex; gap: 22px; font-weight: 600; font-size: 15px; }
  .topo-site nav a { color: var(--texto); text-decoration: none; }
  .topo-site nav a:hover { color: var(--primaria); }
  .topo-site .espaco { flex: 1; }
  .urgente { background: #fbefe2; color: #6b3d00; border-bottom: 1px solid #e9c9a3; }
  .urgente .dentro { max-width: 1120px; margin: 0 auto; padding: 12px 20px; display: flex; gap: 12px; align-items: flex-start; }
  .urgente svg { flex-shrink: 0; margin-top: 2px; }
  .urgente p { margin: 0; }
  .conteudo { max-width: 1120px; margin: 0 auto; padding: 28px 20px 48px; display: grid; gap: 28px; }
  .coluna { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
  section > h1, section > h2 { margin: 0 0 12px; }
  h1 { font-size: 30px; }
  h2 { font-size: 23px; }
  .avisos { display: grid; gap: 12px; }
  .aviso { background: var(--superficie); border: 1px solid var(--linha); border-radius: 18px; overflow: hidden; }
  .aviso img { width: 100%; max-height: 320px; object-fit: cover; display: block; background: var(--neutro); }
  .aviso .texto { padding: 14px 18px; }
  .aviso strong { display: block; font-size: 17px; }
  .aviso p { margin: 4px 0 0; color: var(--suave); white-space: pre-line; }
  .aviso .ate { font-size: 13px; color: var(--suave); margin-top: 6px; }
  .acoes-site { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .acao { display: flex; flex-direction: column; gap: 8px; padding: 18px; border-radius: 18px; text-decoration: none; background: var(--superficie); border: 1px solid var(--linha); color: var(--texto); }
  .acao.principal { background: var(--primaria); border-color: var(--primaria); color: #fff; }
  .acao strong { font-size: 17px; }
  .acao span { font-size: 14px; color: var(--suave); }
  .acao.principal span { color: #d6e8e5; }
  .acao:hover { border-color: var(--borda); }
  .icone-acao { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: var(--primaria-suave); margin-bottom: 2px; }
  .acao.principal .icone-acao { background: rgba(255, 255, 255, .16); }
  .icone-acao svg { width: 26px; height: 26px; }
  .acao.principal:hover { background: var(--primaria-escura); color: #fff; }
  .lista { background: var(--superficie); border: 1px solid var(--linha); border-radius: 18px; padding: 4px 18px; }
  .evento { display: flex; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--linha); }
  .evento:last-child { border-bottom: 0; }
  .data { width: 48px; flex-shrink: 0; text-align: center; padding: 4px 0; border-radius: 10px; background: var(--neutro); font-size: 12px; font-weight: 600; line-height: 1.2; text-transform: uppercase; }
  .data b { display: block; font-size: 19px; }
  .data.hoje { background: var(--primaria-suave); color: var(--primaria-escura); }
  .evento .info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .evento .info span { font-size: 14px; color: var(--suave); }
  .evento a { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .caixa { background: var(--superficie); border: 1px solid var(--linha); border-radius: 18px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
  .caixa h2 { margin: 0; font-size: 21px; }
  .par { display: flex; justify-content: space-between; gap: 12px; }
  .endereco { color: var(--suave); padding-top: 10px; border-top: 1px solid var(--linha); white-space: pre-line; }
  .pix { display: flex; gap: 16px; align-items: center; }
  .pix img { width: 120px; height: 120px; flex-shrink: 0; border-radius: 10px; border: 1px solid var(--linha); background: #fff; }
  .passos-pix { margin: 0; padding-left: 20px; color: var(--suave); font-size: 14px; line-height: 1.6; }
  .passos-pix strong { color: var(--texto); }
  #contribuir textarea { min-height: 0; font-family: ui-monospace, monospace; font-size: 13px; }
  .pix { padding-top: 12px; border-top: 1px solid var(--linha); }
  .pix code { display: block; padding: 8px 10px; border-radius: 10px; background: var(--neutro); font-size: 14px; overflow-wrap: anywhere; margin: 6px 0 10px; }
  .rodape-site { max-width: 1120px; margin: 0 auto; padding: 8px 20px 40px; display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--suave); font-size: 14px; }
  .rodape-site .equipe { color: var(--suave); }
  .faixa-redes { background: var(--primaria); color: #fff; }
  .faixa-redes .dentro { max-width: 1120px; margin: 0 auto; padding: 36px 20px 26px; display: flex; flex-direction: column; gap: 16px; }
  .faixa-redes h2 { margin: 0; color: #fff; font-size: 27px; }
  .faixa-redes p { margin: 0; color: #d6e8e5; font-size: 16px; }
  .botoes-redes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .rede { display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 8px 22px; border-radius: 30px; background: #fff; color: var(--texto); text-decoration: none; border: 1px solid #fff; }
  .rede strong { display: block; font-size: 16px; }
  .rede small { display: block; font-size: 13px; color: var(--suave); }
  .rede.contorno { background: rgba(255, 255, 255, .14); border-color: rgba(255, 255, 255, .45); color: #fff; }
  .rede.contorno small { color: #d6e8e5; }
  .rede:hover { color: var(--texto); box-shadow: 0 0 0 3px rgba(255, 255, 255, .35); }
  .rede.contorno:hover { color: #fff; }
  .rede:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .assinatura { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; padding-top: 8px; font-size: 14px; color: #d6e8e5; }
  .assinatura .equipe { color: #fff; }
  @media (min-width: 960px) { .faixa-redes .dentro { padding: 44px 20px 30px; } .faixa-redes h2 { font-size: 34px; } }
  .carregando { text-align: center; color: var(--suave); padding: 48px 0; }
  /* Carrossel de fotos (capa) */
  .capa { max-width: 1120px; margin: 24px auto 0; padding: 0 20px; }
  .capa .moldura { position: relative; border-radius: 20px; overflow: hidden; background: var(--neutro); }
  .trilho { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; aspect-ratio: 4 / 3; outline: none; }
  .trilho::-webkit-scrollbar { display: none; }
  .trilho:focus-visible { box-shadow: inset 0 0 0 3px var(--primaria); }
  .slide { flex: 0 0 100%; margin: 0; position: relative; scroll-snap-align: start; }
  .slide a, .slide img { display: block; width: 100%; height: 100%; }
  .slide img { object-fit: cover; }
  .slide figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 38px; background: rgba(28, 27, 25, .62); color: #fff; font-weight: 600; font-size: 16px; }
  .capa.uma .slide figcaption { padding-bottom: 12px; }
  .pontos { position: absolute; left: 0; right: 0; bottom: 6px; display: flex; justify-content: center; gap: 2px; }
  .pontos button { width: 28px; height: 28px; padding: 0; border: 0; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .pontos button::before { content: ''; width: 9px; height: 9px; border-radius: 5px; background: rgba(255, 255, 255, .6); transition: width .2s; }
  .pontos button[aria-current="true"]::before { width: 22px; background: #fff; }
  .seta { position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; border-radius: 23px; border: 0; background: rgba(255, 255, 255, .9); color: var(--texto); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .seta:hover { background: #fff; }
  .seta.anterior { left: 14px; }
  .seta.proxima { right: 14px; }
  /* 16:9 até 540 px de altura (altura calculada: aspect-ratio + max-height estreitaria o trilho). */
  @media (min-width: 700px) { .trilho { aspect-ratio: auto; height: min(540px, calc((100vw - 40px) * 9 / 16)); } }
  @media (max-width: 600px) { .seta { display: none; } .capa { margin-top: 14px; padding: 0 16px; } }
  @media (prefers-reduced-motion: reduce) { .trilho { scroll-behavior: auto; } .pontos button::before { transition: none; } }
  @media (min-width: 960px) {
    .conteudo { grid-template-columns: minmax(0, 1.8fr) minmax(0, 1fr); gap: 32px; }
    .avisos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .aviso.com-imagem { grid-row: span 2; }
    .acoes-site { grid-template-columns: 1fr; }
    h1 { font-size: 34px; }
  }
  @media (max-width: 600px) {
    .topo-site nav { display: none; }
    .topo-site .dentro { justify-content: space-between; flex-wrap: nowrap; gap: 12px; }
    .topo-site img { height: 34px; }
    .topo-site .espaco { display: none; }
  }
</style>
</head>
<body>
<header class="topo-site">
  <div class="dentro">
    <a href="/" aria-label="Página inicial"><img src="/logo.png" alt="Igreja Diakonia Tulipas"></a>
    <span class="espaco"></span>
    <nav aria-label="Nesta página" id="menu-site"></nav>
    <a class="botao secundario pequeno" href="/painel">Área da equipe</a>
  </div>
</header>
<div id="urgentes"></div>
<section class="capa" id="capa" aria-roledescription="carrossel" aria-label="Fotos da igreja" hidden></section>

<main class="conteudo" id="conteudo">
  <p class="carregando" id="carregando">Carregando…</p>
  <div class="coluna" id="principal" hidden></div>
  <aside class="coluna" id="lateral" hidden></aside>
</main>
<section class="faixa-redes" id="redes" aria-labelledby="redes-t" hidden></section>
<footer class="rodape-site" id="rodape" hidden></footer>

<script>
  'use strict';
  /** Cria elementos sem innerHTML (o conteúdo vem do painel). */
  function el(tag, props = {}, ...filhos) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (v === undefined || v === null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    }
    for (const f of filhos.flat()) if (f !== null && f !== undefined && f !== false) e.append(f);
    return e;
  }
  const $ = (id) => document.getElementById(id);
  const svg = (caminho, cor = 'currentColor') => {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('width', '22'); s.setAttribute('height', '22'); s.setAttribute('viewBox', '0 0 24 24');
    s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor'); s.style.stroke = cor; s.setAttribute('stroke-width', '2');
    s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round'); s.setAttribute('aria-hidden', 'true');
    s.innerHTML = caminho; // ícone fixo deste arquivo, nunca conteúdo do painel
    return s;
  };
  const dataCurta = (iso) => new Date(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
  const diaIso = (d) => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;

  function secao(id, titulo, ...conteudo) {
    return el('section', { id, 'aria-labelledby': id + '-t' }, el('h2', { id: id + '-t' }, titulo), ...conteudo);
  }

  function montar(s) {
    document.title = s.igreja;
    const menu = [];

    // Avisos urgentes: faixa no topo
    $('urgentes').replaceChildren(...s.urgentes.map((u) => el('div', { class: 'urgente', role: 'alert' },
      el('div', { class: 'dentro' },
        svg('<path d="M12 3l9 16H3z"></path><path d="M12 10v4M12 17v.5"></path>'),
        el('p', {}, el('strong', {}, u.titulo), u.texto ? ' ' + u.texto : '')))));

    montarCarrossel(s.galeria || []);

    const principal = [];
    if (s.avisos.length) {
      menu.push(['avisos', 'Avisos']);
      principal.push(el('section', { id: 'avisos', 'aria-labelledby': 'avisos-t' },
        el('h1', { id: 'avisos-t' }, 'Avisos da semana'),
        el('div', { class: 'avisos' }, s.avisos.map((a) => el('article', { class: 'aviso' + (a.imagem ? ' com-imagem' : '') },
          a.imagem ? el('img', { src: a.imagem, alt: a.titulo, loading: 'lazy' }) : null,
          el('div', { class: 'texto' },
            el('strong', {}, a.titulo),
            a.texto ? el('p', {}, a.texto) : null,
            a.validoAte ? el('div', { class: 'ate' }, 'Até ' + dataCurta(a.validoAte)) : null))))));
    }

    if (s.agenda && s.eventos.length) {
      menu.push(['agenda', 'Agenda']);
      const hoje = diaIso(new Date());
      principal.push(secao('agenda', 'Próximos eventos', el('div', { class: 'lista' }, s.eventos.map((e) => {
        const d = new Date(e.inicio);
        return el('div', { class: 'evento' },
          el('span', { class: 'data' + (diaIso(d) === hoje ? ' hoje' : '') },
            d.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', ''), el('b', {}, String(d.getDate()))),
          el('div', { class: 'info' }, el('strong', {}, e.titulo), el('span', {}, [e.horario, e.local].filter(Boolean).join(' · '))),
          el('a', { href: e.ics, 'aria-label': 'Adicionar "' + e.titulo + '" ao meu calendário' }, '+ Agenda'));
      }))));
    }

    const lateral = [
      el('div', { class: 'acoes-site' },
        el('a', { class: 'acao principal', href: '/oracao' },
          // Mão segurando um coração: o mesmo símbolo dos motivos de oração no app do tablet.
          el('span', { class: 'icone-acao' }, svg(
            '<path d="M11 14h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 16"></path>' +
            '<path d="m7 20 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.91l-4.2 3.9"></path>' +
            '<path d="m2 15 6 6"></path>' +
            '<path d="M19.5 8.5c.7-.7 1.5-1.6 1.5-2.7A2.73 2.73 0 0 0 16 4a2.78 2.78 0 0 0-5 1.8c0 1.2.8 2 1.5 2.8L16 12Z"></path>',
            '#fff')),
          el('strong', {}, 'Pedido de oração'), el('span', {}, 'O pastor recebe e ora por você')),
        el('a', { class: 'acao', href: '/mensagens' },
          el('span', { class: 'icone-acao' }, svg(
            '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path><path d="M13 8H7"></path><path d="M17 12H7"></path>',
            'var(--primaria)')),
          el('strong', {}, 'Fale com a igreja'), el('span', {}, 'Dúvidas, sugestões, críticas'))),
    ];

    if (s.cultos.length || s.endereco) {
      menu.push(['cultos', 'Cultos']);
      lateral.push(el('section', { class: 'caixa', id: 'cultos', 'aria-labelledby': 'cultos-t' },
        el('h2', { id: 'cultos-t' }, 'Nossos cultos'),
        s.cultos.map((c) => el('div', { class: 'par' }, el('span', {}, c.dia), el('strong', {}, c.hora))),
        s.endereco ? el('div', { class: 'endereco' }, s.endereco) : null,
        s.mapa ? el('a', { class: 'botao secundario', href: s.mapa, target: '_blank', rel: 'noopener' }, 'Como chegar') : null));
    }

    if (s.pix) {
      menu.push(['contribuir', 'Contribuir']);
      const resultado = el('p', { class: 'dica', role: 'status', style: 'margin:0' });
      // Sem permissão de área de transferência: mostra o texto para copiar à mão.
      const manual = el('textarea', { readonly: true, rows: 3, hidden: true, 'aria-label': 'Código Pix copia e cola' });
      async function copiar(texto, aviso) {
        try {
          await navigator.clipboard.writeText(texto);
          resultado.textContent = aviso;
          manual.hidden = true;
        } catch {
          manual.value = texto;
          manual.hidden = false;
          manual.select();
          resultado.textContent = 'Toque e segure no texto abaixo para copiar.';
        }
      }
      lateral.push(el('section', { class: 'caixa', id: 'contribuir', 'aria-labelledby': 'contribuir-t' },
        el('h2', { id: 'contribuir-t' }, 'Dízimos e ofertas (PIX)'),
        el('button', { class: 'botao', type: 'button', style: 'width:100%',
          onclick: () => copiar(s.pix.copiaECola, 'Código copiado! Agora é só colar no app do banco.') }, 'Copiar código Pix'),
        el('ol', { class: 'passos-pix' },
          el('li', {}, 'Toque em ', el('strong', {}, 'Copiar código Pix'), '.'),
          el('li', {}, 'No app do seu banco, abra ', el('strong', {}, 'Pix › Pix copia e cola'), '.'),
          el('li', {}, 'Cole o código, digite o valor e confirme.')),
        resultado, manual,
        el('div', { class: 'pix' },
          el('img', { src: s.pix.qr, alt: 'QR code do PIX da igreja', loading: 'lazy' }),
          el('div', {},
            el('span', { class: 'dica' }, 'Pelo QR code ou pela chave:'),
            el('code', {}, s.pix.chaveFormatada || s.pix.chave),
            el('span', { class: 'dica', style: 'display:block;margin-bottom:8px' }, s.pix.nome),
            el('button', { class: 'botao secundario pequeno', type: 'button',
              onclick: () => copiar(s.pix.chave, 'Chave copiada.') }, 'Copiar chave')))));
    }

    $('menu-site').replaceChildren(...menu.map(([id, nome]) => el('a', { href: '#' + id }, nome)));
    $('principal').replaceChildren(...principal);
    $('lateral').replaceChildren(...lateral);
    $('principal').hidden = principal.length === 0;
    $('lateral').hidden = false;
    if (!principal.length) $('conteudo').style.gridTemplateColumns = 'minmax(0, 560px)';
    if (!principal.length) $('conteudo').style.justifyContent = 'center';

    // Faixa "Acompanhe a igreja" com as redes cadastradas; sem redes, fica só o rodapé simples.
    const botoes = [
      s.redes.instagram && botaoRede(s.redes.instagram, 'Seguir no Instagram', perfil(s.redes.instagram, 'instagram'),
        '<rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><path d="M17.5 6.5v.01"></path>', '#8e2c55'),
      s.redes.youtube && botaoRede(s.redes.youtube, 'Assistir no YouTube', perfil(s.redes.youtube, 'youtube') || 'cultos ao vivo e gravados',
        '<rect x="2" y="5" width="20" height="14" rx="4"></rect><path d="M10 9l5 3-5 3z"></path>', '#a3261e'),
      s.redes.whatsapp && botaoRede(s.redes.whatsapp, 'Chamar no WhatsApp', 'fale com a secretaria',
        '<path d="M4 20l1.5-4A8 8 0 1 1 9 19.5z"></path>', '#fff', true),
    ].filter(Boolean);
    const assinatura = [el('span', {}, s.igreja), el('a', { class: 'equipe', href: '/painel' }, 'Área da equipe')];
    if (botoes.length) {
      $('redes').replaceChildren(el('div', { class: 'dentro' },
        el('h2', { id: 'redes-t' }, 'Acompanhe a igreja durante a semana'),
        el('p', {}, s.redes.instagram && s.redes.youtube && s.redes.whatsapp
          ? 'Fotos, avisos, cultos ao vivo e contato direto com a secretaria.'
          : 'Siga e fale com a igreja também fora dos cultos.'),
        el('div', { class: 'botoes-redes' }, botoes),
        el('div', { class: 'assinatura' }, assinatura)));
      $('redes').hidden = false;
    } else {
      $('rodape').replaceChildren(...assinatura);
      $('rodape').hidden = false;
    }
    $('carregando').remove();
  }

  /** Carrossel de fotos no topo: arrastar no celular, setas e bolinhas, passa sozinho a cada 6 s. */
  function montarCarrossel(fotos) {
    const capa = $('capa');
    if (!fotos.length) {
      capa.hidden = true;
      return;
    }
    const trilho = el('div', { class: 'trilho', tabindex: '0', 'aria-label': 'Use as setas do teclado para trocar de foto' },
      fotos.map((f, i) => {
        const imagem = el('img', {
          src: f.url, alt: f.legenda || 'Foto ' + (i + 1) + ' da igreja', loading: i === 0 ? 'eager' : 'lazy',
          width: f.largura, height: f.altura,
        });
        return el('figure', { class: 'slide', role: 'group', 'aria-roledescription': 'foto', 'aria-label': (i + 1) + ' de ' + fotos.length },
          f.link ? el('a', { href: f.link, target: '_blank', rel: 'noopener' }, imagem) : imagem,
          f.legenda ? el('figcaption', {}, f.legenda) : null);
      }));
    const atual = () => Math.round(trilho.scrollLeft / Math.max(trilho.clientWidth, 1));
    const reduzido = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const ir = (i) => trilho.scrollTo({ left: ((i + fotos.length) % fotos.length) * trilho.clientWidth, behavior: reduzido ? 'auto' : 'smooth' });
    const pontos = fotos.map((_, i) => el('button', { type: 'button', 'aria-label': 'Ver foto ' + (i + 1) + ' de ' + fotos.length, onclick: () => ir(i) }));
    const marcar = () => pontos.forEach((b, i) => b.setAttribute('aria-current', String(i === atual())));
    let espera;
    trilho.addEventListener('scroll', () => {
      clearTimeout(espera);
      espera = setTimeout(marcar, 80);
    });
    trilho.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') ir(atual() + 1);
      else if (e.key === 'ArrowLeft') ir(atual() - 1);
      else return;
      e.preventDefault();
    });
    const varias = fotos.length > 1;
    capa.classList.toggle('uma', !varias);
    capa.replaceChildren(el('div', { class: 'moldura' }, trilho,
      varias ? el('button', { class: 'seta anterior', type: 'button', 'aria-label': 'Foto anterior', onclick: () => ir(atual() - 1) },
        svg('<path d="M15 6l-6 6 6 6"></path>')) : null,
      varias ? el('button', { class: 'seta proxima', type: 'button', 'aria-label': 'Próxima foto', onclick: () => ir(atual() + 1) },
        svg('<path d="M9 6l6 6-6 6"></path>')) : null,
      varias ? el('div', { class: 'pontos' }, pontos) : null));
    capa.hidden = false;
    marcar();

    // Passa sozinho, mas para enquanto a pessoa interage (mouse, dedo ou teclado) ou com a aba escondida.
    if (!varias || reduzido) return;
    let pausado = false;
    let retomar;
    const pausar = () => (pausado = true);
    const continuar = () => (pausado = false);
    capa.addEventListener('mouseenter', pausar);
    capa.addEventListener('mouseleave', continuar);
    capa.addEventListener('focusin', pausar);
    capa.addEventListener('focusout', continuar);
    capa.addEventListener('touchstart', () => {
      pausar();
      clearTimeout(retomar);
      retomar = setTimeout(continuar, 10000);
    }, { passive: true });
    setInterval(() => {
      if (!pausado && !document.hidden) ir(atual() + 1);
    }, 6000);
  }

  /** "@perfil" a partir do link (instagram.com/perfil ou youtube.com/@perfil). */
  function perfil(url, rede) {
    try {
      const primeiro = new URL(url).pathname.split('/').filter(Boolean)[0] || '';
      if (rede === 'instagram' && primeiro && !['p', 'reel', 'reels', 'stories', 'explore'].includes(primeiro)) return '@' + primeiro;
      if (rede === 'youtube' && primeiro.startsWith('@')) return primeiro;
    } catch {
      // link fora do padrão: mostra só o nome da rede
    }
    return '';
  }

  function botaoRede(url, titulo, detalhe, icone, cor, contorno = false) {
    return el('a', { class: 'rede' + (contorno ? ' contorno' : ''), href: url, target: '_blank', rel: 'noopener' },
      svg(icone, cor), el('span', {}, el('strong', {}, titulo), detalhe ? el('small', {}, detalhe) : null));
  }

  fetch('/api/public/inicio')
    .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
    .then(montar)
    .catch(() => {
      $('carregando').replaceChildren('Não foi possível carregar agora. ',
        el('a', { href: '/oracao' }, 'Fazer um pedido de oração'), ' · ', el('a', { href: '/mensagens' }, 'Falar com a igreja'));
    });
</script>
