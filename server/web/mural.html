<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mural — Igreja Diakonia Tulipas</title>
<style>
  :root { --fundo: #0b1026; --texto: #ffffff; --suave: rgba(255,255,255,.72); --cor: #5c6bc0;
    --linha: rgba(255,255,255,.12); --ponto: rgba(255,255,255,.25); --ponto-ativo: #fff; --realce: brightness(1.6); }
  /* Fundo claro escolhido no /admin: texto escuro (o mural.js liga a classe pela luminância da cor). */
  body.claro { --texto: #15171c; --suave: rgba(0,0,0,.68); --linha: rgba(0,0,0,.14); --ponto: rgba(0,0,0,.22);
    --ponto-ativo: #15171c; --realce: brightness(.8); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--fundo) center / cover no-repeat; }
  html, body { margin: 0; height: 100%; color: var(--texto); overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; cursor: none; }
  body.mouse { cursor: default; }
  header { position: fixed; inset: 0 0 auto 0; height: 11vh; display: flex; align-items: center; justify-content: space-between; padding: 0 4vw; z-index: 2; }
  header img { height: 6.5vh; width: auto; }
  #relogio { font-size: 4.2vh; font-weight: 300; color: var(--suave); font-variant-numeric: tabular-nums; }
  main { position: fixed; inset: 11vh 0 7vh 0; }
  .slide { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 2vh 8vw; text-align: center; opacity: 0; transition: opacity .9s ease; }
  .slide.ativo { opacity: 1; }
  .faixa { width: 12vw; height: .8vh; border-radius: .4vh; background: var(--cor); margin-bottom: 4vh; }
  h1 { margin: 0 0 3.5vh; font-size: 8vh; line-height: 1.1; font-weight: 700; max-width: 85vw; }
  .texto { font-size: 5vh; line-height: 1.35; color: var(--suave); white-space: pre-line; max-width: 80vw; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2.4vh; max-width: 80vw; }
  li { font-size: 4.4vh; line-height: 1.3; white-space: pre-line; }
  li .sub { display: block; font-size: 3.4vh; color: var(--suave); font-style: italic; }
  .slide.imagem { padding: 0 4vw 2vh; }
  .slide.imagem img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 1vh; box-shadow: 0 2vh 6vh rgba(0,0,0,.5); }
  .slide.qr img { height: 46vh; width: 46vh; object-fit: cover; object-position: center; border-radius: 1.5vh; background: #fff; }
  .slide.qr .texto { margin-top: 3vh; }
  /* Agenda: lista com a coluna de data/hora à esquerda. */
  .eventos { display: flex; flex-direction: column; gap: 2.2vh; width: min(88vw, 150vh); text-align: left; }
  .evento { display: grid; grid-template-columns: 30vh 1fr; gap: 3vh; align-items: baseline; padding-bottom: 2vh; border-bottom: .2vh solid var(--linha); }
  .evento:last-child { border-bottom: 0; }
  .evento .quando { font-size: 3.4vh; font-weight: 600; color: var(--cor); filter: var(--realce); }
  .evento .titulo { font-size: 4.2vh; font-weight: 700; line-height: 1.2; }
  .evento .local { font-size: 3vh; color: var(--suave); margin-top: .6vh; }
  .evento .descricao { font-size: 2.6vh; color: var(--suave); margin-top: .6vh; line-height: 1.35; }
  /* Hoje: menos itens, letras maiores. */
  .slide.hoje h1 { font-size: 10vh; }
  .slide.hoje .evento { grid-template-columns: 34vh 1fr; }
  .slide.hoje .evento .quando { font-size: 5vh; }
  .slide.hoje .evento .titulo { font-size: 5.6vh; }
  .slide.hoje .evento .local { font-size: 3.6vh; }
  footer { position: fixed; inset: auto 0 0 0; height: 7vh; display: flex; align-items: center; justify-content: center; gap: 1vh; }
  .ponto { width: 1.1vh; height: 1.1vh; border-radius: 50%; background: var(--ponto); transition: background .4s; }
  .ponto.ativo { background: var(--ponto-ativo); }
  #vazio { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 4vh; color: var(--suave); }
  #aviso { position: fixed; right: 2vw; bottom: 1.5vh; font-size: 1.8vh; color: var(--suave); }
  /* TV de boas-vindas (?tela=boas-vindas): nomes grandes, poucos por tela. */
  .slide.bv h1 { font-size: 12vh; margin-bottom: 5vh; }
  .nomes { display: grid; gap: 3.5vh 6vw; justify-items: center; font-size: 7vh; font-weight: 600; line-height: 1.15; }
  .nomes.duas { grid-template-columns: 1fr 1fr; font-size: 6vh; }
  .slide.bvVazio h1 { font-size: 9vh; max-width: 80vw; }
  .slide.bvVazio img { height: 44vh; width: 44vh; object-fit: cover; object-position: center; border-radius: 1.5vh; background: #fff; margin-top: 1vh; }
  .slide.bvVazio .texto { margin-top: 3vh; }
</style>
</head>
<body>
<header>
  <img id="logo" src="/logo-claro.png" alt="Igreja Diakonia Tulipas">
  <div id="relogio" aria-live="off"></div>
</header>
<main id="palco" aria-live="polite"></main>
<footer id="pontos"></footer>
<div id="vazio" hidden>Nenhum aviso no momento.</div>
<div id="aviso" hidden>Sem conexão com o servidor — mostrando a última versão</div>
<script>
  'use strict';
  // Parâmetros opcionais na URL: ?segundos=12
  const params = new URLSearchParams(location.search);
  const SEGUNDOS = Math.max(4, Number(params.get('segundos')) || 12);
  // Mural protegido: a chave da URL também vale para a API.
  const CHAVE = params.get('chave');
  // ?tela=boas-vindas: TV logo depois da recepção, só com as boas-vindas aos visitantes de hoje.
  const TELA = params.get('tela') === 'boas-vindas' ? 'boas-vindas' : null;
  const consulta = new URLSearchParams();
  if (CHAVE) consulta.set('chave', CHAVE);
  if (TELA) consulta.set('tela', TELA);
  const API_MURAL = '/api/public/mural' + (consulta.toString() ? '?' + consulta : '');
  const palco = document.getElementById('palco');
  const pontos = document.getElementById('pontos');
  let slides = [];
  let assinatura = '';
  let atual = -1;
  let timer;

  function el(tag, props = {}, ...filhos) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === 'class') e.className = v; else if (k === 'style') e.style.cssText = v; else e.setAttribute(k, v);
    }
    for (const f of filhos.flat()) if (f !== null && f !== undefined) e.append(f);
    return e;
  }

  function criarSlide(s) {
    const cor = s.cor ? `--cor:${s.cor}` : '';
    switch (s.tipo) {
      case 'imagem':
        return el('section', { class: 'slide imagem' }, el('img', { src: s.imagem, alt: s.titulo }));
      case 'qr':
        return el('section', { class: 'slide qr' },
          el('h1', {}, s.titulo),
          el('img', { src: s.imagem, alt: 'QR code: ' + s.titulo }),
          el('div', { class: 'texto' }, s.texto || ''));
      case 'lista':
        return el('section', { class: 'slide', style: cor },
          el('div', { class: 'faixa' }),
          el('h1', {}, s.titulo),
          el('ul', {}, (s.itens || []).map((i) => {
            const [linha, ...resto] = i.split('\n');
            return el('li', {}, linha, resto.length ? el('span', { class: 'sub' }, resto.join(' ')) : null);
          })));
      case 'hoje':
      case 'agenda':
        return el('section', { class: 'slide ' + s.tipo, style: cor },
          el('div', { class: 'faixa' }),
          el('h1', {}, s.titulo),
          el('div', { class: 'eventos' }, (s.eventos || []).map((e) => el('div', { class: 'evento' },
            el('div', { class: 'quando' }, e.quando),
            el('div', {},
              el('div', { class: 'titulo' }, e.titulo),
              e.local ? el('div', { class: 'local' }, e.local) : null,
              e.descricao ? el('div', { class: 'descricao' }, e.descricao) : null)))));
      case 'bv':
        return el('section', { class: 'slide bv', style: '--cor:#ef8a3c' },
          el('div', { class: 'faixa' }),
          el('h1', {}, s.titulo),
          el('div', { class: 'nomes' + (s.itens.length > 4 ? ' duas' : '') }, s.itens.map((n) => el('div', {}, n))));
      case 'bvVazio':
        return el('section', { class: 'slide bvVazio', style: '--cor:#ef8a3c' },
          el('div', { class: 'faixa' }),
          el('h1', {}, s.titulo),
          s.imagem ? el('img', { src: s.imagem, alt: 'QR code do cadastro de visitante' }) : null,
          s.texto ? el('div', { class: 'texto' }, s.texto) : null);
      default:
        return el('section', { class: 'slide', style: cor },
          el('div', { class: 'faixa' }),
          el('h1', {}, s.titulo),
          s.texto ? el('div', { class: 'texto' }, s.texto) : null);
    }
  }

  function montar() {
    palco.replaceChildren(...slides.map(criarSlide));
    pontos.replaceChildren(...slides.map(() => el('span', { class: 'ponto' })));
    document.getElementById('vazio').hidden = slides.length > 0;
    atual = -1;
    proximo();
  }

  function proximo() {
    clearTimeout(timer);
    if (!slides.length) return;
    atual = (atual + 1) % slides.length;
    [...palco.children].forEach((s, i) => s.classList.toggle('ativo', i === atual));
    [...pontos.children].forEach((p, i) => p.classList.toggle('ativo', i === atual));
    // Cartazes ficam um pouco mais.
    const extra = slides[atual].tipo === 'imagem' ? 1.5 : 1;
    timer = setTimeout(proximo, SEGUNDOS * 1000 * extra);
  }

  /** Boas-vindas: 8 nomes por tela; sem visitantes ainda, o convite com o QR do cadastro. */
  function slidesBoasVindas(j) {
    document.title = 'Boas-vindas — ' + j.igreja;
    const nomes = j.nomes || [];
    if (!nomes.length) {
      return [{ tipo: 'bvVazio', titulo: `Seja bem-vindo à ${j.igreja}!`, imagem: j.qr || null,
        texto: j.qr ? 'Primeira vez aqui? Aponte a câmera do celular e deixe seu contato.' : '' }];
    }
    const paginas = [];
    for (let i = 0; i < nomes.length; i += 8) paginas.push(nomes.slice(i, i + 8));
    return paginas.map((p) => ({ tipo: 'bv', titulo: 'Sejam bem-vindos!', itens: p }));
  }

  /** Fundo escolhido no /admin: cor, imagem opcional com véu escuro e texto claro ou escuro. */
  let fundoAtual = '';
  function aplicarFundo(f) {
    if (!f) return;
    const chave = JSON.stringify(f);
    if (chave === fundoAtual) return;
    fundoAtual = chave;
    const raiz = document.documentElement;
    raiz.style.setProperty('--fundo', f.cor || '#0b1026');
    const veu = Math.min(90, Math.max(0, Number(f.escurecer) || 0)) / 100;
    raiz.style.backgroundImage = f.imagem
      ? `linear-gradient(rgba(0,0,0,${veu}), rgba(0,0,0,${veu})), url("${f.imagem}")` : '';
    // Sem imagem, a cor decide: acima de 0,3 de luminância o texto escuro tem mais contraste que o branco.
    const claro = !f.imagem && luminancia(f.cor || '#0b1026') > 0.3;
    document.body.classList.toggle('claro', claro);
    document.getElementById('logo').src = claro ? '/logo.png' : '/logo-claro.png';
  }

  function luminancia(hex) {
    const n = parseInt(hex.slice(1), 16);
    const canal = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; };
    return 0.2126 * canal((n >> 16) & 255) + 0.7152 * canal((n >> 8) & 255) + 0.0722 * canal(n & 255);
  }

  async function carregar() {
    try {
      const r = await fetch(API_MURAL, { cache: 'no-store' });
      if (!r.ok) throw new Error();
      const j = await r.json();
      document.getElementById('aviso').hidden = true;
      aplicarFundo(j.fundo);
      const lista = TELA ? slidesBoasVindas(j) : j.slides;
      const nova = JSON.stringify(lista);
      // Só remonta quando o conteúdo mudou, para não reiniciar a sequência à toa.
      if (nova !== assinatura) {
        assinatura = nova;
        slides = lista;
        montar();
      }
    } catch {
      document.getElementById('aviso').hidden = false;
    }
  }

  function relogio() {
    const d = new Date();
    document.getElementById('relogio').textContent =
      d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' }) + ' · ' +
      d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  // Clique ou tecla: tela cheia. O cursor só aparece quando o mouse se mexe.
  document.addEventListener('click', () => document.documentElement.requestFullscreen?.().catch(() => {}));
  document.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') proximo(); });
  let ocultar;
  document.addEventListener('mousemove', () => {
    document.body.classList.add('mouse');
    clearTimeout(ocultar);
    ocultar = setTimeout(() => document.body.classList.remove('mouse'), 2500);
  });

  relogio();
  setInterval(relogio, 15000);
  carregar();
  // A TV de boas-vindas consulta mais vezes: o nome aparece segundos depois do cadastro.
  setInterval(carregar, TELA ? 10000 : 60000);
</script>
</body>
</html>
