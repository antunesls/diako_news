<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedido de oração — Igreja Diakonia Tulipas</title>
<link rel="stylesheet" href="/estilo.css?v=5">
<style>
  .contador { float: right; }
</style>
</head>
<body class="publico">
<main>
  <header><img src="/logo.png" alt="Igreja Diakonia Tulipas"></header>

  <section id="formulario">
    <p class="sobretitulo">Estamos com você</p>
    <h1 id="titulo">Pedido de oração</h1>
    <p class="intro" id="intro">Conte para nós como podemos orar por você. O pastor recebe todos os pedidos.</p>

    <form id="form" class="cartao" novalidate>
      <div class="campo">
        <label for="motivo">Motivo de oração</label>
        <textarea id="motivo" name="motivo" maxlength="500" required placeholder="Ex: cirurgia na quinta-feira, emprego, família…"></textarea>
        <span class="dica contador" id="contador">0/500</span>
      </div>

      <div class="campo">
        <label for="para">Por quem orar <span class="dica">(opcional)</span></label>
        <input type="text" id="para" name="para" maxlength="100" placeholder="Ex: minha mãe, Família Souza">
      </div>

      <fieldset class="campo" style="border:0;padding:0;margin:0 0 18px">
        <legend style="font-weight:500;margin-bottom:8px">Assunto</legend>
        <div class="chips">
          <label><input type="radio" name="tipo" value="saude">Saúde</label>
          <label><input type="radio" name="tipo" value="familia">Família</label>
          <label><input type="radio" name="tipo" value="trabalho">Trabalho</label>
          <label><input type="radio" name="tipo" value="gratidao">Gratidão</label>
          <label><input type="radio" name="tipo" value="outro" checked>Outro</label>
        </div>
      </fieldset>

      <div class="campo">
        <label for="enviadoPor">Seu nome <span class="dica">(opcional, só o pastor vê)</span></label>
        <input type="text" id="enviadoPor" name="enviadoPor" maxlength="80" autocomplete="name">
      </div>

      <div class="campo">
        <label class="marcar">
          <input type="checkbox" id="publico" name="publico">
          <span>Pode ser lido no telão durante o culto<br><span class="dica">Se não marcar, o pedido fica só com o pastor.</span></span>
        </label>
      </div>

      <!-- Campo armadilha contra robôs: pessoas não veem nem preenchem. -->
      <div class="escondido" aria-hidden="true">
        <label for="website">Não preencha</label>
        <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
      </div>

      <p id="erro" class="erro" role="alert" hidden></p>
      <button type="submit" class="botao" id="enviar">Enviar pedido</button>
    </form>
  </section>

  <section id="obrigado" class="cartao" hidden>
    <h2>Recebemos seu pedido 🙏</h2>
    <p id="obrigado-texto">Estaremos orando por você.</p>
    <button type="button" class="botao secundario" id="outro">Enviar outro pedido</button>
  </section>

  <p class="rodape">Tem uma dúvida ou sugestão? <a href="/mensagens">Fale com a equipe</a></p>
</main>
<script>
  const form = document.getElementById('form');
  const motivo = document.getElementById('motivo');
  const contador = document.getElementById('contador');
  const erro = document.getElementById('erro');
  const enviar = document.getElementById('enviar');

  motivo.addEventListener('input', () => { contador.textContent = motivo.value.length + '/500'; });

  // Textos configurados na página de administração.
  fetch('/api/public/site').then((r) => r.ok ? r.json() : null).then((s) => {
    if (!s) return;
    if (s.pedidoTitulo) document.getElementById('titulo').textContent = s.pedidoTitulo;
    document.getElementById('intro').textContent = s.pedidoIntro || '';
    document.getElementById('intro').hidden = !s.pedidoIntro;
    if (s.pedidoObrigado) document.getElementById('obrigado-texto').textContent = s.pedidoObrigado;
    if (s.nomeIgreja) document.title = (s.pedidoTitulo || 'Pedido de oração') + ' — ' + s.nomeIgreja;
  }).catch(() => {});

  function mostrarErro(msg) {
    erro.textContent = msg;
    erro.hidden = !msg;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    mostrarErro('');
    if (!motivo.value.trim()) {
      mostrarErro('Escreva o motivo de oração.');
      motivo.focus();
      return;
    }
    const dados = {
      motivo: motivo.value,
      para: form.para.value,
      tipo: form.tipo.value,
      enviadoPor: form.enviadoPor.value,
      publico: form.publico.checked,
      website: form.website.value,
    };
    enviar.disabled = true;
    enviar.textContent = 'Enviando…';
    try {
      const r = await fetch('/api/public/pedidos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dados),
      });
      if (!r.ok) {
        const j = await r.json().catch(() => ({}));
        throw new Error(j.erro || 'Não foi possível enviar. Tente novamente.');
      }
      form.reset();
      contador.textContent = '0/500';
      document.getElementById('formulario').hidden = true;
      document.getElementById('obrigado').hidden = false;
    } catch (err) {
      mostrarErro(err.message === 'Failed to fetch' ? 'Sem conexão com o servidor. Verifique sua internet e tente de novo.' : err.message);
    } finally {
      enviar.disabled = false;
      enviar.textContent = 'Enviar pedido';
    }
  });

  document.getElementById('outro').addEventListener('click', () => {
    document.getElementById('obrigado').hidden = true;
    document.getElementById('formulario').hidden = false;
    motivo.focus();
  });
</script>
</body>
</html>
