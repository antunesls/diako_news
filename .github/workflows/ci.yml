name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  servidor:
    name: Servidor e pacote compartilhado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
      - name: Testes do diako_core
        working-directory: packages/diako_core
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test
      - name: Testes do servidor
        working-directory: server
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test
      - name: Compilar servidor e agente (Linux)
        working-directory: server
        run: |
          dart compile exe bin/diako_server.dart -o /tmp/diako_server
          dart compile exe bin/diako_agente.dart -o /tmp/diako_agente
      - name: Verificar scripts de instalação
        run: |
          for f in server/deploy/instalar-lxc.sh server/empacotar-linux.sh tool/ci/*.sh; do bash -n "$f"; done
          shellcheck -S warning server/deploy/instalar-lxc.sh server/empacotar-linux.sh

  app:
    name: App Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Gerar pasta android
        run: bash tool/ci/preparar_android.sh
      - run: flutter pub get
      - name: Análise
        run: bash tool/ci/executar.sh "flutter analyze" flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Testes
        run: bash tool/ci/executar.sh "flutter test" flutter test
      - name: Compilar APK (debug)
        run: bash tool/ci/executar.sh "APK debug" flutter build apk --debug

  instalador-windows:
    name: Configuração do agente (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./server/test/normalizar_agente_test.ps1
