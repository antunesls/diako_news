name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  servidor:
    name: Servidor e pacote compartilhado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Testes do diako_core
        working-directory: packages/diako_core
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test
      - name: Testes do servidor
        working-directory: server
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test

  app:
    name: App Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Gerar pasta android
        run: bash tool/ci/preparar_android.sh
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Compilar APK (debug)
        run: flutter build apk --debug
