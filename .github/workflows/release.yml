name: Release

# Publica uma versão ao enviar uma tag, por exemplo:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  servidor:
    name: Servidor (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
      - name: Versão
        id: versao
        shell: bash
        run: echo "valor=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Testar, compilar e empacotar
        working-directory: server
        shell: pwsh
        run: |
          dart pub get
          ./empacotar.ps1 -Versao ${{ steps.versao.outputs.valor }}
      - uses: actions/upload-artifact@v4
        with:
          name: servidor
          path: server/dist/DiakoServer-*.zip
          if-no-files-found: error

  servidor-linux:
    name: Servidor (Linux / LXC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
      - name: Testar, compilar e empacotar
        working-directory: server
        run: bash empacotar-linux.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: servidor-linux
          path: server/dist/DiakoServer-linux-x64-*.tar.gz
          if-no-files-found: error

  app:
    name: App Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Versão
        id: versao
        run: echo "valor=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Gerar pasta android
        run: bash tool/ci/preparar_android.sh
      - run: flutter pub get
      - name: Ícone do app
        run: dart run flutter_launcher_icons
      - name: Testes
        run: bash tool/ci/executar.sh "flutter test" flutter test
      - name: Assinatura
        run: bash tool/ci/assinar_android.sh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Compilar APK
        run: |
          bash tool/ci/executar.sh "APK release" flutter build apk --release \
            --build-name ${{ steps.versao.outputs.valor }} \
            --build-number ${{ github.run_number }}
          mv build/app/outputs/flutter-apk/app-release.apk "DiakoNews-${{ steps.versao.outputs.valor }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: DiakoNews-*.apk
          if-no-files-found: error

  publicar:
    name: Publicar release
    needs: [servidor, servidor-linux, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            DiakoServer-*.zip
            DiakoServer-linux-x64-*.tar.gz
            DiakoNews-*.apk
          generate_release_notes: true
          body: |
            ## Como instalar
            **Servidor na internet (LXC/VPS):** baixe o `DiakoServer-linux-x64-*.tar.gz` no servidor e siga o [guia de hospedagem](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/HOSPEDAGEM.md). No PC da igreja, use o `DiakoServer-*.zip` e rode `instalar.ps1 -Modo agente`.

            **Servidor no próprio PC do Holyrics:** baixe o `DiakoServer-*.zip`, descompacte e rode `instalar.ps1` como administrador. Detalhes no [LEIA-ME do servidor](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/server/LEIA-ME.md).

            **Tablet:** baixe o `DiakoNews-*.apk` no tablet e abra para instalar (permita "instalar apps desconhecidos" se o Android pedir).

            Ao atualizar, `config.json`, `agente.json` e os dados são mantidos.
